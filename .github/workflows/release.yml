name: release

# Push a tag created from `changie latest` after batching (see CONTRIBUTING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check changie release notes exist
        run: test -f ".changes/${GITHUB_REF_NAME}.md" || (echo "::error::Missing .changes/${GITHUB_REF_NAME}.md; run 'changie batch' first." && exit 1)
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2.19"
          args: release --clean --release-notes .changes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token with contents:write on moexx399/homebrew-tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
